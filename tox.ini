[tox]
envlist = py310,py311,py312,py313,py314,coverage

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, coverage

[testenv]
extras =
  full
deps = pynose
changedir = {envtmpdir}
commands =
    nosetests --where={toxinidir}/tests --ignore-files=citeproc-test.py -v
    python {toxinidir}/tests/citeproc-test.py --no-update

[coverage-config]
setenv =
    COVERAGE_FILE = {toxinidir}/.coverage
    COVERAGE_RCFILE = {toxinidir}/pyproject.toml

[testenv:py314]
setenv = {[coverage-config]setenv}
deps =
    {[testenv]deps}
    coverage
commands =
    coverage run -m nose --where={toxinidir}/tests --ignore-files=citeproc-test.py -v
    coverage run {toxinidir}/tests/citeproc-test.py

# combine the parallel data files py314 left behind and report on them; runs
# from {toxinidir} so the paths in the report are relative to the source tree
[testenv:coverage]
depends = py314
skip_install = true
changedir = {toxinidir}
passenv = GITHUB_*
setenv = {[coverage-config]setenv}
deps =
    coverage
    coveralls
commands =
    coverage combine
    coverage report
    - coveralls
